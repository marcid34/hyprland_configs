# eink — mako
#
# E-ink — paper. Pure black on warm white, no colour, no gloss.
# Anchored top-right to match the bar's edge; offsets measured against this
# rice's actual bar height (28px), not assumed.

anchor=top-right
layer=top
outer-margin=32,4,4,4
margin=4
padding=11,13
width=380
height=165
border-size=1
border-radius=0

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#ffffffff
text-color=#111111
border-color=#d6d6cf
progress-color=over #ebebe6

icons=0

icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#8a8a84
border-color=#ebebe6
default-timeout=3000

[urgency=normal]
text-color=#111111
border-color=#d6d6cf
default-timeout=5000

[urgency=critical]
text-color=#8c2f39
border-color=#8c2f39
progress-color=over #8c2f39
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
