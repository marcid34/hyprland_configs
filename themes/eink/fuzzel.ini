# fuzzel — a single narrow prompt, nothing else on screen.
[main]
font=Adwaita Mono:size=12
terminal=alacritty -e
layer=overlay
width=38
lines=10
horizontal-pad=22
vertical-pad=18
inner-pad=8

[colors]
background=f7f7f4f5
text=111111ff
match=111111ff
selection=111111ff
selection-text=f7f7f4ff
selection-match=f7f7f4ff
border=ebebe6ff

[border]
width=1
radius=8
