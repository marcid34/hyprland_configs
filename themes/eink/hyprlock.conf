# eink — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/eink/eink.jpg
    blur_passes = 0
    blur_size = 0
    brightness = 0.8
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(111111ff)
    inner_color = rgba(f7f7f4d8)
    font_color = rgba(111111ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##d6d6cf">password</span>
    hide_input = false
    rounding = 0
    check_color = rgba(2f5d62ff)
    fail_color = rgba(8c2f39ff)
    fail_text = <span foreground="##8c2f39">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(111111ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(d6d6cfff)
    font_size = 16
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = eink
    color = rgba(111111ff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
