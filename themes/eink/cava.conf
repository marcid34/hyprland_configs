## eink — cava
## Launched by linux_showcase.sh as:  cava -p <this file>
## Kept out of ~/.config/cava so switching rice cannot clobber a config you
## may have tuned by hand.

[general]
framerate = 60
autosens = 1
overshoot = 20
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[smoothing]
noise_reduction = 45

[color]
background = '#f7f7f4'
foreground = '#111111'
gradient = 1
gradient_count = 5
gradient_color_1 = '#ebebe6'
gradient_color_2 = '#111111'
gradient_color_3 = '#4a3f6b'
gradient_color_4 = '#2f5d62'
gradient_color_5 = '#111111'
