# glacier — hyprlock
# Cool glass and ice blue. The bright rice, with the glare taken out.
#
# The wallpaper stays legible under the blur rather than being dimmed to a
# backdrop: this set is built around surfaces sitting on a visible desktop, and
# the lock screen is the last place to abandon that.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/glacier/glacier.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.86
    contrast = 1.0
    vibrancy = 0.18
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(2f7fd8ff)
    inner_color = rgba(ffffffe8)
    font_color = rgba(1a2431ff)
    check_color = rgba(3fb0c4ff)
    fail_color = rgba(c4514fff)
    fade_on_empty = false
    placeholder_text = <span foreground="##97a6b7">Password</span>
    fail_text = <span foreground="##c4514f">Wrong</span>
    rounding = 16
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(1a2431ff)
    font_size = 84
    font_family = Adwaita Sans Light
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(6b7c90ff)
    font_size = 16
    font_family = Adwaita Sans
    position = 0, 108
    halign = center
    valign = center
}

label {
    monitor =
    text = glacier
    color = rgba(97a6b7ff)
    font_size = 11
    font_family = Adwaita Sans
    position = 0, 40
    halign = center
    valign = bottom
}
