# glacier — mako
# Cool glass and ice blue. The bright rice, with the glare taken out.
#
# Rounded to the shell's nested-card radius rather than its island radius: a
# notification is a card that arrives, not a panel that lives there.
anchor=top-right
layer=top
outer-margin=62,10,10,10
margin=8
padding=14,17
width=380
height=170
border-size=1
border-radius=12
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=rgba(255, 255, 255, 0.94)
text-color=#1a2431
border-color=#d3dde9
progress-color=over #e4ebf3
icons=1
max-icon-size=32
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6b7c90
border-color=#d3dde9
default-timeout=3000

[urgency=normal]
text-color=#1a2431
border-color=#d3dde9
default-timeout=5000

[urgency=critical]
text-color=#1a2431
border-color=#c4514f
progress-color=over #c4514f
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
