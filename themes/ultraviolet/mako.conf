# ultraviolet — mako
# Ultraviolet — monochrome violet. One hue, twelve values, nothing else.
anchor=top-right
layer=top
outer-margin=44,6,6,6
margin=6
padding=13,16
width=390
height=170
border-size=1
border-radius=12
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=#150e21fa
text-color=#ddd0f0
border-color=#2c1e42
progress-color=over #1e142e
icons=1
max-icon-size=30
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6b5a8a
border-color=#1e142e
default-timeout=3000

[urgency=normal]
text-color=#ddd0f0
border-color=#2c1e42
default-timeout=5000

[urgency=critical]
text-color=#b76bff
border-color=#b76bff
progress-color=over #b76bff
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
