# ultraviolet — hyprlock
# Ultraviolet — monochrome violet. One hue, twelve values, nothing else.
background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/ultraviolet/ultraviolet.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(9d6bffff)
    inner_color = rgba(0f0a18d9)
    font_color = rgba(ddd0f0ff)
    placeholder_text = <span foreground="##6b5a8a">password</span>
    rounding = 12
    check_color = rgba(a68fffff)
    fail_color = rgba(b76bffff)
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ddd0f0ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = ultraviolet
    color = rgba(9d6bffff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
