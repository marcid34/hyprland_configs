# dracula — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/kib/Pictures/Wallpapers/themes/dracula.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(bd93f9ff)
    inner_color = rgba(282a36d8)
    font_color = rgba(f8f8f2ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##44475a">password</span>
    hide_input = false
    rounding = 8
    check_color = rgba(8be9fdff)
    fail_color = rgba(ff5555ff)
    fail_text = <span foreground="##ff5555">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f8f8f2ff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(44475aff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = dracula
    color = rgba(bd93f9ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
