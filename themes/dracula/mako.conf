# dracula — mako
#
# Dracula — the classic. Violet, magenta and cyan on graphite.
# Anchored top-right to match the bar's edge; offsets measured against this
# rice's actual bar height (34px), not assumed.

anchor=top-right
layer=top
outer-margin=38,4,4,4
margin=4
padding=11,13
width=380
height=165
border-size=1
border-radius=10

font=JetBrainsMono Nerd Font Propo 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#21222cf5
text-color=#f8f8f2
border-color=#44475a
progress-color=over #343746

icons=1
max-icon-size=30
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6272a4
border-color=#343746
default-timeout=3000

[urgency=normal]
text-color=#f8f8f2
border-color=#44475a
default-timeout=5000

[urgency=critical]
text-color=#ff5555
border-color=#ff5555
progress-color=over #ff5555
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
