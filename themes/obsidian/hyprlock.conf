# obsidian — hyprlock
# Obsidian — true black with a single violet. Built for OLED.
background {
    monitor =
    path = /home/kib/Pictures/Wallpapers/themes/obsidian.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(8b5cf6ff)
    inner_color = rgba(000000d9)
    font_color = rgba(e8e8eeff)
    placeholder_text = <span foreground="##5a5a68">password</span>
    rounding = 18
    check_color = rgba(22d3eeff)
    fail_color = rgba(f0517aff)
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e8e8eeff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = obsidian
    color = rgba(8b5cf6ff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
