# obsidian — mako
# Obsidian — true black with a single violet. Built for OLED.
anchor=top-right
layer=top
outer-margin=44,6,6,6
margin=6
padding=13,16
width=390
height=170
border-size=1
border-radius=18
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=#0a0a0cff
text-color=#e8e8ee
border-color=#212127
progress-color=over #141418
icons=1
max-icon-size=30
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#5a5a68
border-color=#141418
default-timeout=3000

[urgency=normal]
text-color=#e8e8ee
border-color=#212127
default-timeout=5000

[urgency=critical]
text-color=#f0517a
border-color=#f0517a
progress-color=over #f0517a
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
