# duskfox — mako
#
# Duskfox — muted violet night. Rose Pine's cousin, cooler and dimmer.
# Anchored top-right to match the bar's edge; offsets measured against this
# rice's actual bar height (32px), not assumed.

anchor=top-right
layer=top
outer-margin=36,4,4,4
margin=4
padding=11,13
width=380
height=165
border-size=1
border-radius=8

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#1d1b2afa
text-color=#e0def4
border-color=#393552
progress-color=over #2d2a45

icons=1
max-icon-size=30
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6e6a86
border-color=#2d2a45
default-timeout=3000

[urgency=normal]
text-color=#e0def4
border-color=#393552
default-timeout=5000

[urgency=critical]
text-color=#eb6f92
border-color=#eb6f92
progress-color=over #eb6f92
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
