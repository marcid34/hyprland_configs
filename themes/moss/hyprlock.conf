# moss — hyprlock
# Moss — desaturated sage and stone. The quietest palette here.
background {
    monitor =
    path = /home/birch/Pictures/Wallpapers/themes/moss.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(8fa876ff)
    inner_color = rgba(1c201bd9)
    font_color = rgba(d4d8ccff)
    placeholder_text = <span foreground="##6c7466">password</span>
    rounding = 10
    check_color = rgba(7c9a8eff)
    fail_color = rgba(a87c7cff)
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(d4d8ccff)
    font_size = 88
    font_family = UbuntuMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = moss
    color = rgba(8fa876ff)
    font_size = 12
    font_family = UbuntuMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
