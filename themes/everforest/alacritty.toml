# everforest — Alacritty
#
# Everforest — soft forest. Low-contrast greens, warm greys, easy eyes.

[colors.primary]
background     = "#2d353b"
foreground     = "#d3c6aa"
dim_foreground = "#9da9a0"

[colors.cursor]
text   = "#2d353b"
cursor = "#a7c080"

[colors.selection]
text       = "#d3c6aa"
background = "#475258"

[colors.normal]
black   = "#343f44"
red     = "#e67e80"
green   = "#a7c080"
yellow  = "#dbbc7f"
blue    = "#7fbbb3"
magenta = "#d699b6"
cyan    = "#83c092"
white   = "#9da9a0"

[colors.bright]
black   = "#475258"
red     = "#e67e80"
green   = "#a7c080"
yellow  = "#dbbc7f"
blue    = "#7fbbb3"
magenta = "#d699b6"
cyan    = "#83c092"
white   = "#d3c6aa"

[window]
padding     = { x = 14, y = 12 }
decorations = "Transparent"
opacity     = 0.94
blur        = true

[font]
normal = { family = "UbuntuMono Nerd Font", style = "Regular" }
size   = 14.0
