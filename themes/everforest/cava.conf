## everforest — cava
## Launched by linux_showcase.sh as:  cava -p <this file>
## Kept out of ~/.config/cava so switching rice cannot clobber a config you
## may have tuned by hand.

[general]
framerate = 60
autosens = 1
overshoot = 20
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[smoothing]
noise_reduction = 45

[color]
background = '#2d353b'
foreground = '#d3c6aa'
gradient = 1
gradient_count = 5
gradient_color_1 = '#343f44'
gradient_color_2 = '#a7c080'
gradient_color_3 = '#d699b6'
gradient_color_4 = '#83c092'
gradient_color_5 = '#d3c6aa'
