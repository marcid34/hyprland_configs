--[[ everforest — conky
     A quiet card in the top-right corner. Low contrast on purpose: this
     rice is built to be looked past, not at. ]]
conky.config = {
    alignment = 'top_right',
    gap_x = 40, gap_y = 60,
    minimum_width = 260,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false, draw_borders = false,
    use_xft = true,
    font = 'UbuntuMono Nerd Font:size=10',
    default_color = '475258',
    color1 = 'a7c080',
    color2 = 'd3c6aa',
    update_interval = 2.0,
    alignment = 'top_right',
}

conky.text = [[
${alignr}${color1}${font UbuntuMono Nerd Font:size=30}${time %H:%M}${font}${color}
${alignr}${color2}${time %A, %d %B}${color}

${alignr}${color}cpu  ${color2}${cpu cpu0}%${color}
${alignr}${color}mem  ${color2}${memperc}%${color}
${alignr}${color}disk ${color2}${fs_used_perc /}%${color}
${alignr}${color}up   ${color2}${uptime_short}${color}
]]
