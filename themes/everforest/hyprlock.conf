# everforest — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/everforest/everforest.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(a7c080ff)
    inner_color = rgba(2d353bd8)
    font_color = rgba(d3c6aaff)
    fade_on_empty = false
    placeholder_text = <span foreground="##475258">password</span>
    hide_input = false
    rounding = 8
    check_color = rgba(83c092ff)
    fail_color = rgba(e67e80ff)
    fail_text = <span foreground="##e67e80">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(d3c6aaff)
    font_size = 88
    font_family = UbuntuMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(475258ff)
    font_size = 16
    font_family = UbuntuMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = everforest
    color = rgba(a7c080ff)
    font_size = 12
    font_family = UbuntuMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
