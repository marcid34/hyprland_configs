# everforest — mako
#
# Everforest — soft forest. Low-contrast greens, warm greys, easy eyes.
# Geometry tracks the bar: 10px radius, 1px border,
# and margins that sum to the same grid Hyprland uses for gaps.

anchor=top-right
layer=top
outer-margin=39,4,4,4
margin=4
padding=11,13
width=390
height=170
border-size=1
border-radius=10

font=Ubuntu 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#272e33ff
text-color=#d3c6aa
border-color=#475258
progress-color=over #343f44

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#7a8478
border-color=#343f44
default-timeout=3000

[urgency=normal]
text-color=#d3c6aa
border-color=#475258
default-timeout=5000

[urgency=critical]
text-color=#e67e80
border-color=#e67e80
progress-color=over #e67e80
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
