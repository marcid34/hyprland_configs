# dawn — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/birch/Pictures/Wallpapers/themes/dawn.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(286983ff)
    inner_color = rgba(faf4edd8)
    font_color = rgba(575279ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##dfdad9">password</span>
    hide_input = false
    rounding = 8
    check_color = rgba(56949fff)
    fail_color = rgba(b4637aff)
    fail_text = <span foreground="##b4637a">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(575279ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(dfdad9ff)
    font_size = 16
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = dawn
    color = rgba(286983ff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
