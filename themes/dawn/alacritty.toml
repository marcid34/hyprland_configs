cursor = "#286983"

[colors.selection]
text       = "#575279"
background = "#dfdad9"

[colors.normal]
black   = "#f2e9e1"
red     = "#b4637a"
green   = "#618774"
yellow  = "#ea9d34"
blue    = "#286983"
magenta = "#907aa9"
cyan    = "#56949f"
white   = "#797593"

[colors.bright]
black   = "#dfdad9"
red     = "#b4637a"
green   = "#618774"
yellow  = "#ea9d34"
blue    = "#286983"
magenta = "#907aa9"
cyan    = "#56949f"
