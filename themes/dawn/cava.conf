## dawn — cava
## Launched by linux_showcase.sh as:  cava -p <this file>
## Kept out of ~/.config/cava so switching rice cannot clobber a config you
## may have tuned by hand.

[general]
framerate = 60
autosens = 1
overshoot = 20
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[smoothing]
noise_reduction = 45

[color]
background = '#faf4ed'
foreground = '#575279'
gradient = 1
gradient_count = 5
gradient_color_1 = '#f2e9e1'
gradient_color_2 = '#286983'
gradient_color_3 = '#907aa9'
gradient_color_4 = '#56949f'
gradient_color_5 = '#575279'
