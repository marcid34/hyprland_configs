# dawn — mako
#
# Dawn — Rose Pine Dawn. A LIGHT rice: warm paper, ink, pine.
# Geometry tracks the bar: 12px radius, 1px border,
# and margins that sum to the same grid Hyprland uses for gaps.

anchor=top-right
layer=top
outer-margin=39,4,4,4
margin=4
padding=11,13
width=390
height=170
border-size=1
border-radius=12

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#fffaf3ff
text-color=#575279
border-color=#dfdad9
progress-color=over #f2e9e1

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#9893a5
border-color=#f2e9e1
default-timeout=3000

[urgency=normal]
text-color=#575279
border-color=#dfdad9
default-timeout=5000

[urgency=critical]
text-color=#b4637a
border-color=#b4637a
progress-color=over #b4637a
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
