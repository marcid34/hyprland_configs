# mercury — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/kib/Pictures/Wallpapers/themes/mercury.jpg
    blur_passes = 2
    blur_size = 2
    brightness = 0.55
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(6fa8dcff)
    inner_color = rgba(0e1013d8)
    font_color = rgba(e6ecf2ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##2b313a">password</span>
    hide_input = false
    rounding = 8
    check_color = rgba(a9c7e8ff)
    fail_color = rgba(e06c75ff)
    fail_text = <span foreground="##e06c75">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e6ecf2ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(2b313aff)
    font_size = 16
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = mercury
    color = rgba(6fa8dcff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
