# fuzzel — a single narrow prompt, nothing else on screen.
[main]
font=Adwaita Mono:size=12
terminal=alacritty -e
layer=overlay
width=38
lines=10
horizontal-pad=22
vertical-pad=18
inner-pad=8

[colors]
background=0e1013f5
text=e6ecf2ff
match=6fa8dcff
selection=6fa8dcff
selection-text=0e1013ff
selection-match=0e1013ff
border=1e2229ff

[border]
width=1
radius=8
