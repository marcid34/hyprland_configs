# mercury — mako
#
# Mercury — cool silver. Near-monochrome, one ice-blue accent.
# Anchored top-right to match the bar's edge; offsets measured against this
# rice's actual bar height (28px), not assumed.

anchor=top-right
layer=top
outer-margin=32,4,4,4
margin=4
padding=11,13
width=380
height=165
border-size=1
border-radius=3

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#15181cff
text-color=#e6ecf2
border-color=#2b313a
progress-color=over #1e2229

icons=1
max-icon-size=30
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6b7684
border-color=#1e2229
default-timeout=3000

[urgency=normal]
text-color=#e6ecf2
border-color=#2b313a
default-timeout=5000

[urgency=critical]
text-color=#e06c75
border-color=#e06c75
progress-color=over #e06c75
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
