# calamity (corruption) — mako
#
# Shadow-purple void, cursed-flame green. The Corruption: vertical chasms, demonite, and a sky that never warms.
# Anchored top-right under this rice's 38px bar, with the biome border the
# notification's only chrome.

anchor=top-right
layer=top
outer-margin=44,6,6,6
margin=6
padding=11,13
width=380
height=170
border-size=2
border-radius=4

font=JetBrainsMono Nerd Font Propo 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#1f1533f2
text-color=#e2d8f5
border-color=#9d7cd8
progress-color=over #3b2a60

icons=1
max-icon-size=30
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#7d6ba8
border-color=#3b2a60
default-timeout=3000

[urgency=normal]
text-color=#e2d8f5
border-color=#9d7cd8
default-timeout=5000

[urgency=critical]
text-color=#d2688f
border-color=#d2688f
progress-color=over #d2688f
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
