## calamity (corruption) — cava
## Launched by linux_showcase as:  cava -p <this file>
## Kept out of ~/.config/cava so switching rice cannot clobber a config you
## may have tuned by hand.

[general]
framerate = 60
autosens = 1
overshoot = 20
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[smoothing]
noise_reduction = 45

[color]
background = '#191029'
foreground = '#e2d8f5'
gradient = 1
gradient_count = 5
gradient_color_1 = '#3b2a60'
gradient_color_2 = '#9d7cd8'
gradient_color_3 = '#b48ee8'
gradient_color_4 = '#7bd88f'
gradient_color_5 = '#e2d8f5'
