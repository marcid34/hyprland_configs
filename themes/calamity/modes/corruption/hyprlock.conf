# calamity (corruption) — hyprlock
#
# The active biome's own background, dimmed. Switching biome switches this
# too, because modes/current repoints the whole file.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/calamity/corruption.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.45
    contrast = 1.05
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(9d7cd8ff)
    inner_color = rgba(191029e0)
    font_color = rgba(e2d8f5ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##7d6ba8">password</span>
    hide_input = false
    rounding = 4
    check_color = rgba(7bd88fff)
    fail_color = rgba(d2688fff)
    fail_text = <span foreground="##d2688f">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e2d8f5ff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(7d6ba8ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = calamity · corruption
    color = rgba(9d7cd8ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
