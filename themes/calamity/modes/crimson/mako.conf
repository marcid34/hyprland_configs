# calamity (crimson) — mako
#
# Crimtane red, ichor gold, bone. The Crimson: flesh caverns, a bloodied ground and pale bone arches on the horizon.
# Anchored top-right under this rice's 38px bar, with the biome border the
# notification's only chrome.

anchor=top-right
layer=top
outer-margin=44,6,6,6
margin=6
padding=11,13
width=380
height=170
border-size=2
border-radius=4

font=JetBrainsMono Nerd Font Propo 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#22110ff2
text-color=#f2ded8
border-color=#c8443a
progress-color=over #4a231c

icons=1
max-icon-size=30
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#9a716a
border-color=#4a231c
default-timeout=3000

[urgency=normal]
text-color=#f2ded8
border-color=#c8443a
default-timeout=5000

[urgency=critical]
text-color=#e05545
border-color=#e05545
progress-color=over #e05545
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
