## calamity (crimson) — cava
## Launched by linux_showcase as:  cava -p <this file>
## Kept out of ~/.config/cava so switching rice cannot clobber a config you
## may have tuned by hand.

[general]
framerate = 60
autosens = 1
overshoot = 20
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[smoothing]
noise_reduction = 45

[color]
background = '#1a0d0c'
foreground = '#f2ded8'
gradient = 1
gradient_count = 5
gradient_color_1 = '#4a231c'
gradient_color_2 = '#c8443a'
gradient_color_3 = '#a05a7a'
gradient_color_4 = '#e8b13d'
gradient_color_5 = '#f2ded8'
