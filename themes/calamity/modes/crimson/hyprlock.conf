# calamity (crimson) — hyprlock
#
# The active biome's own background, dimmed. Switching biome switches this
# too, because modes/current repoints the whole file.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/calamity/crimson.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.45
    contrast = 1.05
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(c8443aff)
    inner_color = rgba(1a0d0ce0)
    font_color = rgba(f2ded8ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##9a716a">password</span>
    hide_input = false
    rounding = 4
    check_color = rgba(e8b13dff)
    fail_color = rgba(e05545ff)
    fail_text = <span foreground="##e05545">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f2ded8ff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(9a716aff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = calamity · crimson
    color = rgba(c8443aff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
