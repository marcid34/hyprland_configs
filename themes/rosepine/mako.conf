# rosepine — mako
#
# Rose Pine — soho vibes. Muted rose and iris on a deep plum base.
# Geometry tracks the bar: 14px radius, 1px border,
# and margins that sum to the same grid Hyprland uses for gaps.

anchor=top-right
layer=top
outer-margin=39,4,4,4
margin=4
padding=11,13
width=390
height=170
border-size=1
border-radius=14

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#1f1d2efa
text-color=#e0def4
border-color=#403d52
progress-color=over #26233a

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6e6a86
border-color=#26233a
default-timeout=3000

[urgency=normal]
text-color=#e0def4
border-color=#403d52
default-timeout=5000

[urgency=critical]
text-color=#eb6f92
border-color=#eb6f92
progress-color=over #eb6f92
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
