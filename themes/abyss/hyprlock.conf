# abyss — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/birch/Pictures/Wallpapers/themes/abyss.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(2ec4b6ff)
    inner_color = rgba(0b1220d8)
    font_color = rgba(cfe3f5ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##1d3050">password</span>
    hide_input = false
    rounding = 8
    check_color = rgba(48cae4ff)
    fail_color = rgba(ef476fff)
    fail_text = <span foreground="##ef476f">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cfe3f5ff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(1d3050ff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = abyss
    color = rgba(2ec4b6ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
