# abyss — mako
#
# Abyss — deep water. Near-black navy, teal and electric cyan.
# Anchored top-right to match the bar's edge; offsets measured against this
# rice's actual bar height (36px), not assumed.

anchor=top-right
layer=top
outer-margin=40,4,4,4
margin=4
padding=11,13
width=380
height=165
border-size=1
border-radius=14

font=JetBrainsMono Nerd Font Propo 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#0f1a2beb
text-color=#cfe3f5
border-color=#1d3050
progress-color=over #152438

icons=1
max-icon-size=30
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#4a6483
border-color=#152438
default-timeout=3000

[urgency=normal]
text-color=#cfe3f5
border-color=#1d3050
default-timeout=5000

[urgency=critical]
text-color=#ef476f
border-color=#ef476f
progress-color=over #ef476f
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
