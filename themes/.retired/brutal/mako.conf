# brutal — mako
#
# Square, opaque, 3px bordered slab with the yellow accent. Matches the
# waybar blocks exactly: same crust background, same text-coloured border,
# same total absence of rounding.

anchor=top-right
layer=top
# Bar is 30px with a 3px bottom border; clear it, then sit on a 6px grid
# to match Hyprland's gaps_out.
outer-margin=39,3,3,3
margin=3
padding=12,14
width=400
height=170
border-size=3
border-radius=0

font=JetBrainsMono Nerd Font Propo Bold 11
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#11111bff
text-color=#cdd6f4
border-color=#cdd6f4
progress-color=over #f9e2af

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#a6adc8
border-color=#45475a
default-timeout=3000

[urgency=normal]
text-color=#cdd6f4
border-color=#cdd6f4
default-timeout=5000

[urgency=critical]
background-color=#f38ba8ff
text-color=#11111b
border-color=#cdd6f4
progress-color=over #11111b
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
