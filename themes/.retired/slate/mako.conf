# slate — mako
#
# Near-opaque mantle with a 1px surface0 hairline and 6px rounding, matching
# rofi. Quiet by default: normal notifications are subtext grey, and only
# the accent and the critical state carry colour.

anchor=top-right
layer=top
# 30px bar + 1px rule; then an 8px grid matching Hyprland's gaps_out.
outer-margin=35,4,4,4
margin=4
padding=10,13
width=370
height=150
border-size=1
border-radius=6

font=Ubuntu Mono 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#181825f7
text-color=#bac2de
border-color=#313244
progress-color=over #89b4fa

icons=1
max-icon-size=28
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6c7086
border-color=#313244
default-timeout=3000

[urgency=normal]
text-color=#bac2de
border-color=#313244
default-timeout=5000

[urgency=critical]
text-color=#f38ba8
border-color=#f38ba8
progress-color=over #f38ba8
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
