# haze — mako
#
# Deeply translucent with 18px rounding and only a whisper of an edge.
# The Hyprland layer rule blurs the `notifications` namespace, so at this
# alpha the toast reads as frosted glass rather than a dim panel.
#
# progress-color uses `source` rather than `over`: at 0.42 alpha an
# overlaid progress fill blends twice and comes out muddy.

anchor=top-right
layer=top
# Bar sits at 30px; 30+8=38 top, and 8+8=16 elsewhere for the airier
# spacing this rice uses everywhere (cf. Hyprland gaps_out=22).
outer-margin=30,8,8,8
margin=8
padding=16,20
width=400
height=180
border-size=1
border-radius=18

font=Ubuntu Mono 13
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#1e1e2e6b
text-color=#cdd6f4
border-color=#cdd6f424
progress-color=source #f5c2e73d

icons=1
max-icon-size=36
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=4
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#a6adc8
border-color=#cdd6f414
default-timeout=3000

[urgency=normal]
text-color=#cdd6f4
border-color=#cdd6f424
default-timeout=5000

[urgency=critical]
text-color=#f38ba8
border-color=#f38ba866
progress-color=source #f38ba83d
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
