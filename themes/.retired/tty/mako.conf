# tty — mako
#
# A console message: square, opaque crust, 1px green frame, tight padding,
# monospace. No icons — this rice is text-only, and a 32px colour icon
# would be the one non-textual thing on the screen.

anchor=top-right
layer=top
# 30px bar + 1px rule = 31; then a 6px grid matching Hyprland's gaps_out.
outer-margin=34,3,3,3
margin=3
padding=8,10
width=360
height=140
border-size=1
border-radius=0

font=JetBrainsMono Nerd Font Mono 10
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#11111bff
text-color=#a6e3a1
border-color=#a6e3a1
progress-color=over #313244

# icons off entirely — this rice is text-only. max-icon-size is deliberately
# not set: mako rejects 0, and with icons=0 the value is never consulted.
icons=0

default-timeout=5000
ignore-timeout=0
max-visible=6
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6c7086
border-color=#45475a
default-timeout=3000

[urgency=normal]
text-color=#a6e3a1
border-color=#a6e3a1
default-timeout=5000

[urgency=critical]
text-color=#f38ba8
border-color=#f38ba8
progress-color=over #f38ba8
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
