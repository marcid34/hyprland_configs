# emerald — mako
#
# Emerald — deep green glass. Jewel tones on near-black forest.
# Anchored top-right to match the bar's edge; offsets measured against this
# rice's actual bar height (30px), not assumed.

anchor=top-right
layer=top
outer-margin=34,4,4,4
margin=4
padding=11,13
width=380
height=165
border-size=1
border-radius=4

font=JetBrainsMono Nerd Font Propo 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#0c1f18ff
text-color=#d7f5e6
border-color=#1a4433
progress-color=over #123024

icons=1
max-icon-size=30
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#4b7a66
border-color=#123024
default-timeout=3000

[urgency=normal]
text-color=#d7f5e6
border-color=#1a4433
default-timeout=5000

[urgency=critical]
text-color=#ff6b81
border-color=#ff6b81
progress-color=over #ff6b81
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
