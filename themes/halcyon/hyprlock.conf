# halcyon — hyprlock
# Warm charcoal and coral. Soft light, hard edges nowhere.
#
# The wallpaper stays legible under the blur rather than being dimmed to a
# backdrop: this set is built around surfaces sitting on a visible desktop, and
# the lock screen is the last place to abandon that.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/halcyon/halcyon.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.62
    contrast = 1.0
    vibrancy = 0.18
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(ff8f6eff)
    inner_color = rgba(17151be8)
    font_color = rgba(f4f0f5ff)
    check_color = rgba(ffbfa0ff)
    fail_color = rgba(ff7a7aff)
    fade_on_empty = false
    placeholder_text = <span foreground="##6b6275">Password</span>
    fail_text = <span foreground="##ff7a7a">Wrong</span>
    rounding = 16
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f4f0f5ff)
    font_size = 84
    font_family = Adwaita Sans Light
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(9a90a3ff)
    font_size = 16
    font_family = Adwaita Sans
    position = 0, 108
    halign = center
    valign = center
}

label {
    monitor =
    text = halcyon
    color = rgba(6b6275ff)
    font_size = 11
    font_family = Adwaita Sans
    position = 0, 40
    halign = center
    valign = bottom
}
