# noir — mako
# Noir — film stock. Hard greyscale, one crimson accent, deep shadows.
anchor=bottom-right
layer=top
outer-margin=44,6,6,6
margin=6
padding=13,16
width=390
height=170
border-size=1
border-radius=0
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=#141416ff
text-color=#e4e4e6
border-color=#2c2c30
progress-color=over #1e1e21
icons=1
max-icon-size=30
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6a6a70
border-color=#1e1e21
default-timeout=3000

[urgency=normal]
text-color=#e4e4e6
border-color=#2c2c30
default-timeout=5000

[urgency=critical]
text-color=#c1272d
border-color=#c1272d
progress-color=over #c1272d
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
