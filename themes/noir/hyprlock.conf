# noir — hyprlock
# Noir — film stock. Hard greyscale, one crimson accent, deep shadows.
background {
    monitor =
    path = /home/birch/Pictures/Wallpapers/themes/noir.jpg
    blur_passes = 0
    blur_size = 0
    brightness = 0.8
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(c1272dff)
    inner_color = rgba(0c0c0dd9)
    font_color = rgba(e4e4e6ff)
    placeholder_text = <span foreground="##6a6a70">password</span>
    rounding = 0
    check_color = rgba(a8a8aeff)
    fail_color = rgba(c1272dff)
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e4e4e6ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}
