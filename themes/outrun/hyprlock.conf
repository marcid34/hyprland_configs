# outrun — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/kib/Pictures/Wallpapers/themes/outrun.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(ff2e97ff)
    inner_color = rgba(0d0221d8)
    font_color = rgba(f0e6ffff)
    fade_on_empty = false
    placeholder_text = <span foreground="##3b2d6b">password</span>
    hide_input = false
    rounding = 8
    check_color = rgba(00f0ffff)
    fail_color = rgba(ff2e97ff)
    fail_text = <span foreground="##ff2e97">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f0e6ffff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(3b2d6bff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = outrun
    color = rgba(ff2e97ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
