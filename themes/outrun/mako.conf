# outrun — mako
#
# Outrun — 1984 neon. Indigo night, hot magenta, cyan horizon.
# Geometry tracks the bar: 4px radius, 2px border,
# and margins that sum to the same grid Hyprland uses for gaps.

anchor=top-right
layer=top
outer-margin=42,4,4,4
margin=4
padding=12,14
width=390
height=170
border-size=2
border-radius=4

font=JetBrainsMono Nerd Font Propo 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#190b33f5
text-color=#f0e6ff
border-color=#3b2d6b
progress-color=over #241b4d

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6b5b9a
border-color=#241b4d
default-timeout=3000

[urgency=normal]
text-color=#f0e6ff
border-color=#3b2d6b
default-timeout=5000

[urgency=critical]
text-color=#ff2e97
border-color=#ff2e97
progress-color=over #ff2e97
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
