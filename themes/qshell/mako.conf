# QShell Showcase — mako
#
# Sits under the floating bar, matching its radius and hairline so a
# notification reads as another surface of the same shell.

anchor=top-right
layer=top
outer-margin=64,10,10,10
margin=8
padding=14,16
width=380
height=170
border-size=1
border-radius=14

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#111419f5
text-color=#eef2f7
border-color=#222833
progress-color=over #171b22

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=4
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#93a0b0
border-color=#222833
default-timeout=3000

[urgency=normal]
text-color=#eef2f7
border-color=#222833
default-timeout=5000

[urgency=critical]
text-color=#f87171
border-color=#f87171
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
