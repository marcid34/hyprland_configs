# QShell Showcase — hyprlock
#
# Same restraint as the shell: the wallpaper barely dimmed, one hairline
# field, and type doing the work.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/qshell/qshell.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.5
    contrast = 1.0
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(222833ff)
    inner_color = rgba(111419e8)
    font_color = rgba(eef2f7ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##5c6673">Password</span>
    hide_input = false
    rounding = 12
    check_color = rgba(5b9dffff)
    fail_color = rgba(f87171ff)
    fail_text = <span foreground="##f87171">Try again</span>
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(eef2f7ff)
    font_size = 96
    font_family = Adwaita Sans
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(93a0b0ff)
    font_size = 15
    font_family = Adwaita Sans
    position = 0, 30
    halign = center
    valign = center
}

label {
    monitor =
    text = QShell Showcase
    color = rgba(5c6673ff)
    font_size = 11
    font_family = Adwaita Sans
    position = 0, 36
    halign = center
    valign = bottom
}
