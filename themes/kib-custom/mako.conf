# ~/.config/mako/config
#
# Catppuccin Mocha — the same object as a waybar pill, scaled to a toast.
#   base   #1e1e2e   surface0 #313244   surface1 #45475a
#   overlay0 #6c7086   subtext0 #a6adc8   text   #cdd6f4
#   mauve  #cba6f7 (accent)   red #f38ba8   yellow #f9e2af
#
# Geometry is borrowed, not invented:
#   background  rgba(30,30,46,0.9)  = waybar pill = alacritty opacity 0.9
#   border      1px #45475a         = every waybar module
#   radius      8px                 = waybar pill (rofi uses 12px because
#                                     it is a large centred window; a toast
#                                     is pill-sized, so it takes the pill's)
#   font        Ubuntu Mono         = waybar text + alacritty

# ── Geometry ───────────────────────────────────────────────
anchor=top-right
layer=top
# mako sums outer-margin + margin on the outermost edges, so these are
# chosen to resolve to Hyprland's gaps_out=10 on every side:
#   right  5+5 = 10  -> flush with the waybar pill right edge
#                       (.modules-right padding 8px + pill margin 2px)
#   top   35+5 = 40  -> 5px below the bar. Note the bar is 35px tall, not
#                       the 30 configured in config.jsonc: waybar auto-grows
#                       when a theme's font + padding need more room, and
#                       this stylesheet does. Measured, not assumed.
#   left/bottom      -> 10
# Between stacked toasts the two margins also sum to 10, so the gap
# between notifications equals the gap between tiled windows.
outer-margin=35,5,5,5
margin=5
padding=11,14
width=380
height=160
border-size=1
border-radius=8

# ── Type ───────────────────────────────────────────────────
font=Ubuntu Mono 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

# ── Colour ─────────────────────────────────────────────────
background-color=#1e1e2ee6
text-color=#cdd6f4
border-color=#45475a
progress-color=over #45475a

# ── Icons ──────────────────────────────────────────────────
icons=1
max-icon-size=32
icon-location=left

# ── Behaviour ──────────────────────────────────────────────
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

# ── Urgency ────────────────────────────────────────────────
# Mirrors how waybar signals state: the pill border carries the
# severity (cf. #battery.critical / #network.disconnected, which
# set both color and border-color to red).

[urgency=low]
text-color=#a6adc8
border-color=#313244
default-timeout=3000

[urgency=normal]
text-color=#cdd6f4
border-color=#45475a
default-timeout=5000

[urgency=critical]
text-color=#f38ba8
border-color=#f38ba8
progress-color=over #f38ba8
default-timeout=0

# ── Modes ──────────────────────────────────────────────────
# `makoctl mode -t do-not-disturb` silences everything but
# criticals; bound to SUPER+SHIFT+N in hyprland.lua.
[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
