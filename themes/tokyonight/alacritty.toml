# tokyonight — Alacritty
#
# Tokyo Night — neon dusk. Deep navy glass, electric blue and violet.

[colors.primary]
background     = "#1a1b26"
foreground     = "#c0caf5"
dim_foreground = "#a9b1d6"

[colors.cursor]
text   = "#1a1b26"
cursor = "#7aa2f7"

[colors.selection]
text       = "#c0caf5"
background = "#283457"

[colors.normal]
black   = "#292e42"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#3b4261"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[window]
padding     = { x = 14, y = 12 }
decorations = "Transparent"
opacity     = 0.88
blur        = true

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
size   = 13.0
