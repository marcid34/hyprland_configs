## tokyonight — cava
## Launched by linux_showcase.sh as:  cava -p <this file>
## Kept out of ~/.config/cava so switching rice cannot clobber a config you
## may have tuned by hand.

[general]
framerate = 60
autosens = 1
overshoot = 20
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[smoothing]
noise_reduction = 45

[color]
background = '#1a1b26'
foreground = '#c0caf5'
gradient = 1
gradient_count = 5
gradient_color_1 = '#292e42'
gradient_color_2 = '#7aa2f7'
gradient_color_3 = '#bb9af7'
gradient_color_4 = '#7dcfff'
gradient_color_5 = '#c0caf5'
