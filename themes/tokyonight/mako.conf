# tokyonight — mako
#
# Tokyo Night — neon dusk. Deep navy glass, electric blue and violet.
# Geometry tracks the bar: 12px radius, 1px border,
# and margins that sum to the same grid Hyprland uses for gaps.

anchor=top-right
layer=top
outer-margin=39,4,4,4
margin=4
padding=11,13
width=390
height=170
border-size=1
border-radius=12

font=JetBrainsMono Nerd Font Propo 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#16161ef0
text-color=#c0caf5
border-color=#3b4261
progress-color=over #292e42

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#565f89
border-color=#292e42
default-timeout=3000

[urgency=normal]
text-color=#c0caf5
border-color=#3b4261
default-timeout=5000

[urgency=critical]
text-color=#f7768e
border-color=#f7768e
progress-color=over #f7768e
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
