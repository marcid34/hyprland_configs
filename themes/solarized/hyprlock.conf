# solarized — hyprlock
# Solarized Dark — the 2011 classic. Teal base, restrained accents.
background {
    monitor =
    path = /home/birch/Pictures/Wallpapers/themes/solarized.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(2aa198ff)
    inner_color = rgba(002b36d9)
    font_color = rgba(93a1a1ff)
    placeholder_text = <span foreground="##586e75">password</span>
    rounding = 6
    check_color = rgba(2aa198ff)
    fail_color = rgba(dc322fff)
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(93a1a1ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = solarized
    color = rgba(2aa198ff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
