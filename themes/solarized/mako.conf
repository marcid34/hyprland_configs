# solarized — mako
# Solarized Dark — the 2011 classic. Teal base, restrained accents.
anchor=top-right
layer=top
outer-margin=44,6,6,6
margin=6
padding=13,16
width=390
height=170
border-size=1
border-radius=6
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=#01323dff
text-color=#93a1a1
border-color=#0f4b58
progress-color=over #073642
icons=1
max-icon-size=30
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#586e75
border-color=#073642
default-timeout=3000

[urgency=normal]
text-color=#93a1a1
border-color=#0f4b58
default-timeout=5000

[urgency=critical]
text-color=#dc322f
border-color=#dc322f
progress-color=over #dc322f
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
