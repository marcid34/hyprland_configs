# tofi — one line, like a shell prompt. Suits the console rices.
font = Adwaita Mono
font-size = 13
width = 100%
height = 34
horizontal = true
anchor = top
prompt-text = "run: "
padding-top = 0
padding-bottom = 0
padding-left = 14
padding-right = 14
result-spacing = 22
border-width = 0
outline-width = 0
background-color = #070b14
text-color = #c4d0e4
prompt-color = #4d7cc7
selection-color = #4d7cc7
min-input-width = 120
