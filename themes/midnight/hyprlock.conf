# midnight — hyprlock
# Midnight — deepest navy. Almost no chrome; status on demand only.
background {
    monitor =
    path = /home/kib/Pictures/Wallpapers/themes/midnight.jpg
    blur_passes = 0
    blur_size = 0
    brightness = 0.8
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(4d7cc7ff)
    inner_color = rgba(070b14d9)
    font_color = rgba(c4d0e4ff)
    placeholder_text = <span foreground="##4a5a7a">password</span>
    rounding = 0
    check_color = rgba(4da8c7ff)
    fail_color = rgba(c75d6bff)
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(c4d0e4ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = midnight
    color = rgba(4d7cc7ff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
