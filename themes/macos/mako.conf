# Mac OS X — mako
# macOS — translucent menubar up top, magnified dock below.
anchor=top-right
layer=top
outer-margin=34,10,6,10
margin=6
padding=14,16
width=380
height=170
border-size=1
border-radius=10
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=#2c2c2ef2
text-color=#ffffff
border-color=#3a3a3c
progress-color=over #0a84ff
icons=1
max-icon-size=32
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=4
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#8e8e93
border-color=#3a3a3c
default-timeout=3000

[urgency=normal]
text-color=#ffffff
border-color=#3a3a3c
default-timeout=5000

[urgency=critical]
text-color=#ff453a
border-color=#ff453a
progress-color=over #ff453a
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
