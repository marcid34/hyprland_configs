# nord — mako
#
# Nord — arctic. Cool blue-greys, frost cyan, zero warmth.
# Anchored bottom-right to match the bar's edge; offsets measured against this
# rice's actual bar height (38px), not assumed.

anchor=bottom-right
layer=top
outer-margin=4,4,42,4
margin=4
padding=10,12
width=380
height=165
border-size=1
border-radius=0

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#272c36ff
text-color=#eceff4
border-color=#4c566a
progress-color=over #3b4252

icons=1
max-icon-size=30
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6b7789
border-color=#3b4252
default-timeout=3000

[urgency=normal]
text-color=#eceff4
border-color=#4c566a
default-timeout=5000

[urgency=critical]
text-color=#bf616a
border-color=#bf616a
progress-color=over #bf616a
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
