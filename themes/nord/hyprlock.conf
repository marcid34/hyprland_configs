# nord — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/kib/Pictures/Wallpapers/themes/nord.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(88c0d0ff)
    inner_color = rgba(2e3440d8)
    font_color = rgba(eceff4ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##4c566a">password</span>
    hide_input = false
    rounding = 8
    check_color = rgba(8fbcbbff)
    fail_color = rgba(bf616aff)
    fail_text = <span foreground="##bf616a">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(eceff4ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(4c566aff)
    font_size = 16
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = nord
    color = rgba(88c0d0ff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
