--[[ blueprint — conky
     A drafting overlay: ruled sections, labelled fields, monospace
     throughout. Sits bottom-left like a title block on a drawing. ]]
conky.config = {
    alignment = 'bottom_left',
    gap_x = 40, gap_y = 50,
    minimum_width = 380,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false, draw_borders = false,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font Mono:size=10',
    default_color = '14344f',
    color1 = '35d6ff',
    color2 = 'e8f4fb',
    update_interval = 1.0,
}

conky.text = [[
${color1}+${hr 1}${color}
${color1}| ${color2}SYSTEM SCHEMATIC${color1}${alignr}REV ${time %Y.%m.%d} |${color}
${color1}+${hr 1}${color}
${color1}| ${color}HOST  ${color2}${nodename}${color}
${color1}| ${color}KERN  ${color2}${kernel}${color}
${color1}| ${color}UPTIME ${color2}${uptime_short}${color}
${color1}+${hr 1}${color}
${color1}| ${color}CPU   ${color2}${cpu cpu0}%${color} ${color1}${cpubar cpu0 5,150}${color}
${color1}| ${color}MEM   ${color2}${memperc}%${color} ${color1}${membar 5,150}${color}
${color1}| ${color}ROOT  ${color2}${fs_used_perc /}%${color} ${color1}${fs_bar 5,150 /}${color}
${color1}+${hr 1}${color}
${color1}| ${color}PROC  ${color2}${top name 1}${color}
${color1}| ${color}      ${color2}${top name 2}${color}
${color1}+${hr 1}${color}
]]
