# blueprint — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/birch/Pictures/Wallpapers/themes/blueprint.png
    blur_passes = 0
    blur_size = 0
    brightness = 0.8
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(35d6ffff)
    inner_color = rgba(06121fd8)
    font_color = rgba(e8f4fbff)
    fade_on_empty = false
    placeholder_text = <span foreground="##14344f">password</span>
    hide_input = false
    rounding = 0
    check_color = rgba(7fe3ffff)
    fail_color = rgba(ff6b8aff)
    fail_text = <span foreground="##ff6b8a">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e8f4fbff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(14344fff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = blueprint
    color = rgba(35d6ffff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 40
    halign = center
    valign = bottom
}
