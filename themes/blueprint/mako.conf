# blueprint — mako
#
# Blueprint — drafting table. Cyan hairlines on navy, all monospace.
# Anchored top-right to match the bar's edge; offsets measured against this
# rice's actual bar height (28px), not assumed.

anchor=top-right
layer=top
outer-margin=32,4,4,4
margin=4
padding=11,13
width=380
height=165
border-size=1
border-radius=0

font=JetBrainsMono Nerd Font Mono 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#081a2bff
text-color=#e8f4fb
border-color=#14344f
progress-color=over #0d2438

icons=0

icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#3f6b8a
border-color=#0d2438
default-timeout=3000

[urgency=normal]
text-color=#e8f4fb
border-color=#14344f
default-timeout=5000

[urgency=critical]
text-color=#ff6b8a
border-color=#ff6b8a
progress-color=over #ff6b8a
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
