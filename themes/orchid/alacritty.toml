# orchid — Alacritty
# Plum dusk and lilac light. Soft focus with a bright edge.

[colors.primary]
background = "#110d17"
foreground = "#f2ecf8"
dim_foreground = "#d5c8e2"

[colors.cursor]
text = "#110d17"
cursor = "#c294ff"

[colors.selection]
text = "#f2ecf8"
background = "#2f2440"

[colors.normal]
black   = "#221a30"
red     = "#ff8ba0"
green   = "#93e0b8"
yellow  = "#f5cc85"
blue    = "#9db4ff"
magenta = "#c294ff"
cyan    = "#8fdcf0"
white   = "#d5c8e2"

[colors.bright]
black   = "#2f2440"
red     = "#ff8ba0"
green   = "#93e0b8"
yellow  = "#f5cc85"
blue    = "#9db4ff"
magenta = "#c294ff"
cyan    = "#8fdcf0"
white   = "#f2ecf8"

[window]
padding = { x = 16, y = 14 }
decorations = "None"
opacity = 0.92
blur = true
dynamic_padding = true

[font]
normal = { family = "Adwaita Mono", style = "Regular" }
size = 13.0

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 620
unfocused_hollow = true
