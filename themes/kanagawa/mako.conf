# kanagawa — mako
#
# Kanagawa — ink wash. Warm sumi blacks, wave blue and carp yellow.
# Geometry tracks the bar: 6px radius, 1px border,
# and margins that sum to the same grid Hyprland uses for gaps.

anchor=top-right
layer=top
outer-margin=35,4,4,4
margin=4
padding=11,13
width=390
height=170
border-size=1
border-radius=6

font=Ubuntu 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#16161dff
text-color=#dcd7ba
border-color=#363646
progress-color=over #2a2a37

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#727169
border-color=#2a2a37
default-timeout=3000

[urgency=normal]
text-color=#dcd7ba
border-color=#363646
default-timeout=5000

[urgency=critical]
text-color=#c34043
border-color=#c34043
progress-color=over #c34043
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
