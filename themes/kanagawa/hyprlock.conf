# kanagawa — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/kanagawa/kanagawa.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(e6c384ff)
    inner_color = rgba(1f1f28d8)
    font_color = rgba(dcd7baff)
    fade_on_empty = false
    placeholder_text = <span foreground="##363646">password</span>
    hide_input = false
    rounding = 8
    check_color = rgba(7aa89fff)
    fail_color = rgba(c34043ff)
    fail_text = <span foreground="##c34043">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(dcd7baff)
    font_size = 88
    font_family = UbuntuMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(363646ff)
    font_size = 16
    font_family = UbuntuMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = kanagawa
    color = rgba(e6c384ff)
    font_size = 12
    font_family = UbuntuMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
