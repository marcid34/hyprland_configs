# arctic — mako
# Arctic — a LIGHT rice. Ice white, pale blue, cold and clean.
anchor=top-right
layer=top
outer-margin=44,6,6,6
margin=6
padding=13,16
width=390
height=170
border-size=1
border-radius=14
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=#ffffffff
text-color=#28323c
border-color=#cfdae4
progress-color=over #e6edf3
icons=1
max-icon-size=30
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#8fa0b0
border-color=#e6edf3
default-timeout=3000

[urgency=normal]
text-color=#28323c
border-color=#cfdae4
default-timeout=5000

[urgency=critical]
text-color=#b3505a
border-color=#b3505a
progress-color=over #b3505a
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
