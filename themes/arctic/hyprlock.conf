# arctic — hyprlock
# Arctic — a LIGHT rice. Ice white, pale blue, cold and clean.
background {
    monitor =
    path = /home/birch/Pictures/Wallpapers/themes/arctic.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(3a7ca5ff)
    inner_color = rgba(f4f7fad9)
    font_color = rgba(28323cff)
    placeholder_text = <span foreground="##8fa0b0">password</span>
    rounding = 14
    check_color = rgba(4e8f9eff)
    fail_color = rgba(b3505aff)
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(28323cff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = arctic
    color = rgba(3a7ca5ff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
