# fuzzel — a single narrow prompt, nothing else on screen.
[main]
font=Adwaita Mono:size=12
terminal=alacritty -e
layer=overlay
width=38
lines=10
horizontal-pad=22
vertical-pad=18
inner-pad=8

[colors]
background=f4f7faf5
text=28323cff
match=3a7ca5ff
selection=3a7ca5ff
selection-text=f4f7faff
selection-match=f4f7faff
border=e6edf3ff

[border]
width=1
radius=8
