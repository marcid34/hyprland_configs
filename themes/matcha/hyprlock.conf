# matcha — hyprlock
# Soft olive under green light. Organic, low, and very calm.
#
# The wallpaper stays legible under the blur rather than being dimmed to a
# backdrop: this set is built around surfaces sitting on a visible desktop, and
# the lock screen is the last place to abandon that.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/matcha/matcha.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.62
    contrast = 1.0
    vibrancy = 0.18
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(a9d84cff)
    inner_color = rgba(141911e8)
    font_color = rgba(eaf0e3ff)
    check_color = rgba(6fd39cff)
    fail_color = rgba(f08b7fff)
    fade_on_empty = false
    placeholder_text = <span foreground="##68735c">Password</span>
    fail_text = <span foreground="##f08b7f">Wrong</span>
    rounding = 16
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(eaf0e3ff)
    font_size = 84
    font_family = Adwaita Sans Light
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(97a389ff)
    font_size = 16
    font_family = Adwaita Sans
    position = 0, 108
    halign = center
    valign = center
}

label {
    monitor =
    text = matcha
    color = rgba(68735cff)
    font_size = 11
    font_family = Adwaita Sans
    position = 0, 40
    halign = center
    valign = bottom
}
