# vellum — hyprlock
# Warm paper and sage ink. A light rice that is not a white screen.
#
# The wallpaper stays legible under the blur rather than being dimmed to a
# backdrop: this set is built around surfaces sitting on a visible desktop, and
# the lock screen is the last place to abandon that.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/vellum/vellum.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.86
    contrast = 1.0
    vibrancy = 0.18
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(6d8f63ff)
    inner_color = rgba(fffdf7e8)
    font_color = rgba(2c2823ff)
    check_color = rgba(b38a52ff)
    fail_color = rgba(b5524aff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a89e8d">Password</span>
    fail_text = <span foreground="##b5524a">Wrong</span>
    rounding = 16
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(2c2823ff)
    font_size = 84
    font_family = Adwaita Sans Light
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(7d7466ff)
    font_size = 16
    font_family = Adwaita Sans
    position = 0, 108
    halign = center
    valign = center
}

label {
    monitor =
    text = vellum
    color = rgba(a89e8dff)
    font_size = 11
    font_family = Adwaita Sans
    position = 0, 40
    halign = center
    valign = bottom
}
