# matrix — hyprlock
# Matrix — code rain. Pure green on black, no chrome at all.
background {
    monitor =
    path = /home/kib/Pictures/Wallpapers/themes/matrix.jpg
    blur_passes = 0
    blur_size = 0
    brightness = 0.8
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(00ff41ff)
    inner_color = rgba(000000d9)
    font_color = rgba(00ff41ff)
    placeholder_text = <span foreground="##046417">password</span>
    rounding = 0
    check_color = rgba(7dffa0ff)
    fail_color = rgba(ff3131ff)
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(00ff41ff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = matrix
    color = rgba(00ff41ff)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Mono
    position = 0, 40
    halign = center
    valign = bottom
}
