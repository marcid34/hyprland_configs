# matrix — mako
# Matrix — code rain. Pure green on black, no chrome at all.
anchor=top-right
layer=top
outer-margin=44,6,6,6
margin=6
padding=13,16
width=390
height=170
border-size=1
border-radius=0
font=JetBrainsMono Nerd Font Mono 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=#020a02ff
text-color=#00ff41
border-color=#0a2814
progress-color=over #04140a
icons=1
max-icon-size=30
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#046417
border-color=#04140a
default-timeout=3000

[urgency=normal]
text-color=#00ff41
border-color=#0a2814
default-timeout=5000

[urgency=critical]
text-color=#ff3131
border-color=#ff3131
progress-color=over #ff3131
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
