--[[ matrix — conky. No bar: the desktop IS the readout. ]]
conky.config = {
    alignment = 'top_left', gap_x = 40, gap_y = 40, minimum_width = 420,
    own_window = true, own_window_type = 'desktop', own_window_transparent = true,
    own_window_argb_visual = true, own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true, draw_shades = false, draw_borders = false,
    use_xft = true, font = 'JetBrainsMono Nerd Font Mono:size=10',
    default_color = '00c832', color1 = '00ff41',
    update_interval = 1.0,
}
conky.text = [[
${color1}${font JetBrainsMono Nerd Font Mono:size=36}${time %H:%M:%S}${font}${color}
${color1}> ${color}SYSTEM ONLINE
${color1}> ${color}HOST   ${nodename}
${color1}> ${color}UPTIME ${uptime_short}
${color1}> ${color}CPU    ${cpu cpu0}%  ${color1}${cpubar cpu0 5,160}${color}
${color1}> ${color}MEM    ${memperc}%  ${color1}${membar 5,160}${color}
${color1}> ${color}DISK   ${fs_used_perc /}%  ${color1}${fs_bar 5,160 /}${color}
${color1}> ${color}PROC   ${top name 1}
${color1}> ${color}       ${top name 2}
]]
