# graphite — mako
# Neutral to the point of silence, with one warm signal in it.
#
# Rounded to the shell's nested-card radius rather than its island radius: a
# notification is a card that arrives, not a panel that lives there.
anchor=top-right
layer=top
outer-margin=62,10,10,10
margin=8
padding=14,17
width=380
height=170
border-size=1
border-radius=12
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=rgba(18, 18, 20, 0.90)
text-color=#eeeef0
border-color=#26262a
progress-color=over #1a1a1d
icons=1
max-icon-size=32
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#8d8d94
border-color=#26262a
default-timeout=3000

[urgency=normal]
text-color=#eeeef0
border-color=#26262a
default-timeout=5000

[urgency=critical]
text-color=#eeeef0
border-color=#e88b8b
progress-color=over #e88b8b
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
