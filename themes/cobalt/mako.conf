# cobalt — mako
# Deep water and luminous azure. Cold, clean, wide awake.
#
# Rounded to the shell's nested-card radius rather than its island radius: a
# notification is a card that arrives, not a panel that lives there.
anchor=top-right
layer=top
outer-margin=62,10,10,10
margin=8
padding=14,17
width=380
height=170
border-size=1
border-radius=12
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=rgba(16, 23, 36, 0.90)
text-color=#e9f0fa
border-color=#222e42
progress-color=over #16202f
icons=1
max-icon-size=32
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#8496ab
border-color=#222e42
default-timeout=3000

[urgency=normal]
text-color=#e9f0fa
border-color=#222e42
default-timeout=5000

[urgency=critical]
text-color=#e9f0fa
border-color=#ff8080
progress-color=over #ff8080
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
