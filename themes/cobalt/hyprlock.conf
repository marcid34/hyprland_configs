# cobalt — hyprlock
# Deep water and luminous azure. Cold, clean, wide awake.
#
# The wallpaper stays legible under the blur rather than being dimmed to a
# backdrop: this set is built around surfaces sitting on a visible desktop, and
# the lock screen is the last place to abandon that.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/cobalt/cobalt.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.62
    contrast = 1.0
    vibrancy = 0.18
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(4d9dffff)
    inner_color = rgba(101724e8)
    font_color = rgba(e9f0faff)
    check_color = rgba(78e2ffff)
    fail_color = rgba(ff8080ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##58687c">Password</span>
    fail_text = <span foreground="##ff8080">Wrong</span>
    rounding = 16
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e9f0faff)
    font_size = 84
    font_family = Adwaita Sans Light
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(8496abff)
    font_size = 16
    font_family = Adwaita Sans
    position = 0, 108
    halign = center
    valign = center
}

label {
    monitor =
    text = cobalt
    color = rgba(58687cff)
    font_size = 11
    font_family = Adwaita Sans
    position = 0, 40
    halign = center
    valign = bottom
}
