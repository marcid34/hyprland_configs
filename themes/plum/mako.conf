# plum — mako
#
# Plum — aubergine and magenta. Rich, saturated, unapologetic.
# Anchored top-right to match the bar's edge; offsets measured against this
# rice's actual bar height (42px), not assumed.

anchor=top-right
layer=top
outer-margin=46,4,4,4
margin=4
padding=11,13
width=380
height=165
border-size=1
border-radius=18

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#1e1526f0
text-color=#ecd9f5
border-color=#3a2949
progress-color=over #291c33

icons=1
max-icon-size=30
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#7a5f8c
border-color=#291c33
default-timeout=3000

[urgency=normal]
text-color=#ecd9f5
border-color=#3a2949
default-timeout=5000

[urgency=critical]
text-color=#e5527a
border-color=#e5527a
progress-color=over #e5527a
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
