## oxocarbon — cava
## Launched by linux_showcase.sh as:  cava -p <this file>
## Kept out of ~/.config/cava so switching rice cannot clobber a config you
## may have tuned by hand.

[general]
framerate = 60
autosens = 1
overshoot = 20
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[smoothing]
noise_reduction = 45

[color]
background = '#161616'
foreground = '#f2f4f8'
gradient = 1
gradient_count = 5
gradient_color_1 = '#262626'
gradient_color_2 = '#ee5396'
gradient_color_3 = '#be95ff'
gradient_color_4 = '#3ddbd9'
gradient_color_5 = '#f2f4f8'
