# oxocarbon — mako
#
# Oxocarbon — IBM Carbon. Near-black, hard edges, electric magenta.
# Geometry tracks the bar: 0px radius, 2px border,
# and margins that sum to the same grid Hyprland uses for gaps.

anchor=top-right
layer=top
outer-margin=34,4,4,4
margin=4
padding=12,14
width=390
height=170
border-size=2
border-radius=0

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#101010ff
text-color=#f2f4f8
border-color=#393939
progress-color=over #262626

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#525252
border-color=#262626
default-timeout=3000

[urgency=normal]
text-color=#f2f4f8
border-color=#393939
default-timeout=5000

[urgency=critical]
text-color=#ff7eb6
border-color=#ff7eb6
progress-color=over #ff7eb6
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
