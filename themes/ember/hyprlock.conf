# ember — hyprlock
# Banked heat. Amber falling into rose, nothing fully cooled.
#
# The wallpaper stays legible under the blur rather than being dimmed to a
# backdrop: this set is built around surfaces sitting on a visible desktop, and
# the lock screen is the last place to abandon that.

background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/ember/ember.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.62
    contrast = 1.0
    vibrancy = 0.18
}

input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(ff9d4dff)
    inner_color = rgba(1b1512e8)
    font_color = rgba(f7ede6ff)
    check_color = rgba(ff6f88ff)
    fail_color = rgba(ff6f88ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##7a655a">Password</span>
    fail_text = <span foreground="##ff6f88">Wrong</span>
    rounding = 16
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f7ede6ff)
    font_size = 84
    font_family = Adwaita Sans Light
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(ab9184ff)
    font_size = 16
    font_family = Adwaita Sans
    position = 0, 108
    halign = center
    valign = center
}

label {
    monitor =
    text = ember
    color = rgba(7a655aff)
    font_size = 11
    font_family = Adwaita Sans
    position = 0, 40
    halign = center
    valign = bottom
}
