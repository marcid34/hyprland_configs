# Windows 11 Pro — hyprlock
background {
    monitor =
    path = /home/birch/Pictures/Wallpapers/themes/win11.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
}
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(0078d4ff)
    inner_color = rgba(2b2b2be6)
    font_color = rgba(ffffffff)
    placeholder_text = <span foreground="##a0a0a0">Enter Password</span>
    rounding = 20
    check_color = rgba(0078d4ff)
    fail_color = rgba(f85149ff)
    position = 0, -80
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffff)
    font_size = 96
    font_family = Adwaita Sans
    position = 0, 110
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(e0e0e0dd)
    font_size = 20
    font_family = Adwaita Sans
    position = 0, 20
    halign = center
    valign = center
}
