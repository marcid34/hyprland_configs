# Windows 11 Pro — Alacritty
# Windows 11 — centred taskbar, Mica surfaces, Fluent blue.

[colors.primary]
background = "#202020"
foreground = "#e0e0e0"
dim_foreground = "#a0a0a0"

[colors.cursor]
text = "#202020"
cursor = "#0078d4"

[colors.selection]
text = "#ffffff"
background = "#3d3d3d"

[colors.normal]
black = "#2b2b2b"
red = "#f85149"
green = "#6ccb5f"
yellow = "#4cc2ff"
blue = "#0078d4"
magenta = "#b4a0ff"
cyan = "#4cc2ff"
white = "#e0e0e0"

[colors.bright]
black = "#3d3d3d"
red = "#f85149"
green = "#6ccb5f"
yellow = "#0078d4"
blue = "#0078d4"
magenta = "#b4a0ff"
cyan = "#4cc2ff"
white = "#ffffff"

[window]
padding = { x = 12, y = 10 }
decorations = "Transparent"
opacity = 0.96
blur = false

[font]
normal = { family = "Adwaita Mono", style = "Regular" }
size = 13.0
