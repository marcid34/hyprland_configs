# Windows 11 Pro — mako
# Windows 11 — centred taskbar, Mica surfaces, Fluent blue.
anchor=bottom-right
layer=top
outer-margin=6,10,56,10
margin=6
padding=14,16
width=380
height=170
border-size=1
border-radius=8
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=#2b2b2bf2
text-color=#ffffff
border-color=#3d3d3d
progress-color=over #0078d4
icons=1
max-icon-size=32
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=4
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#a0a0a0
border-color=#3d3d3d
default-timeout=3000

[urgency=normal]
text-color=#ffffff
border-color=#3d3d3d
default-timeout=5000

[urgency=critical]
text-color=#f85149
border-color=#f85149
progress-color=over #f85149
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
