# fuzzel — a single narrow prompt, nothing else on screen.
[main]
font=Adwaita Mono:size=12
terminal=alacritty -e
layer=overlay
width=38
lines=10
horizontal-pad=22
vertical-pad=18
inner-pad=8

[colors]
background=fbfcfdf5
text=2b3440ff
match=4c6ef5ff
selection=4c6ef5ff
selection-text=fbfcfdff
selection-match=fbfcfdff
border=eef1f5ff

[border]
width=1
radius=8
