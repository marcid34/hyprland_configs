# porcelain — hyprlock
# Porcelain — a LIGHT clinical rice. Cool white, blue-grey, surgical.
background {
    monitor =
    path = /home/birch/Pictures/Wallpapers/themes/porcelain.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(4c6ef5ff)
    inner_color = rgba(fbfcfdd9)
    font_color = rgba(2b3440ff)
    placeholder_text = <span foreground="##95a1b0">password</span>
    rounding = 10
    check_color = rgba(0c8599ff)
    fail_color = rgba(c92a3dff)
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(2b3440ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = porcelain
    color = rgba(4c6ef5ff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
