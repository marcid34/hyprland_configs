# porcelain — mako
# Porcelain — a LIGHT clinical rice. Cool white, blue-grey, surgical.
anchor=top-right
layer=top
outer-margin=44,6,6,6
margin=6
padding=13,16
width=390
height=170
border-size=1
border-radius=10
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=#ffffffff
text-color=#2b3440
border-color=#d8dee6
progress-color=over #eef1f5
icons=1
max-icon-size=30
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#95a1b0
border-color=#eef1f5
default-timeout=3000

[urgency=normal]
text-color=#2b3440
border-color=#d8dee6
default-timeout=5000

[urgency=critical]
text-color=#c92a3d
border-color=#c92a3d
progress-color=over #c92a3d
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
