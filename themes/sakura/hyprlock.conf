# sakura — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/kib/Pictures/Wallpapers/themes/sakura.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(f2a6c2ff)
    inner_color = rgba(1a1520d8)
    font_color = rgba(f2e6efff)
    fade_on_empty = false
    placeholder_text = <span foreground="##3d3047">password</span>
    hide_input = false
    rounding = 8
    check_color = rgba(a8d8eaff)
    fail_color = rgba(e8748fff)
    fail_text = <span foreground="##e8748f">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f2e6efff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(3d3047ff)
    font_size = 16
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = sakura
    color = rgba(f2a6c2ff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
