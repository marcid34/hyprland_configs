# fuzzel — a single narrow prompt, nothing else on screen.
[main]
font=Adwaita Mono:size=12
terminal=alacritty -e
layer=overlay
width=38
lines=10
horizontal-pad=22
vertical-pad=18
inner-pad=8

[colors]
background=1a1520f5
text=f2e6efff
match=f2a6c2ff
selection=f2a6c2ff
selection-text=1a1520ff
selection-match=1a1520ff
border=2e2436ff

[border]
width=1
radius=8
