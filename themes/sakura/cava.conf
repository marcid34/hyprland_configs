## sakura — cava
## Launched by linux_showcase.sh as:  cava -p <this file>
## Kept out of ~/.config/cava so switching rice cannot clobber a config you
## may have tuned by hand.

[general]
framerate = 60
autosens = 1
overshoot = 20
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[smoothing]
noise_reduction = 45

[color]
background = '#1a1520'
foreground = '#f2e6ef'
gradient = 1
gradient_count = 5
gradient_color_1 = '#2e2436'
gradient_color_2 = '#f2a6c2'
gradient_color_3 = '#c9a7d4'
gradient_color_4 = '#a8d8ea'
gradient_color_5 = '#f2e6ef'
