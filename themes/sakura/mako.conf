# sakura — mako
#
# Sakura — blossom at night. Soft pink and lilac on plum-black.
# Anchored top-right to match the bar's edge; offsets measured against this
# rice's actual bar height (34px), not assumed.

anchor=top-right
layer=top
outer-margin=38,4,4,4
margin=4
padding=10,12
width=380
height=165
border-size=1
border-radius=16

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#221b29f5
text-color=#f2e6ef
border-color=#3d3047
progress-color=over #2e2436

icons=1
max-icon-size=30
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#7a6377
border-color=#2e2436
default-timeout=3000

[urgency=normal]
text-color=#f2e6ef
border-color=#3d3047
default-timeout=5000

[urgency=critical]
text-color=#e8748f
border-color=#e8748f
progress-color=over #e8748f
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
