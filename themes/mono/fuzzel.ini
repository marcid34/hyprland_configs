# fuzzel — a single narrow prompt, nothing else on screen.
[main]
font=Adwaita Mono:size=12
terminal=alacritty -e
layer=overlay
width=38
lines=10
horizontal-pad=22
vertical-pad=18
inner-pad=8

[colors]
background=0a0a0af5
text=e8e8e8ff
match=ffffffff
selection=ffffffff
selection-text=0a0a0aff
selection-match=0a0a0aff
border=1c1c1cff

[border]
width=1
radius=8
