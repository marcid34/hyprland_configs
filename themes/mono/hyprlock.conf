# mono — hyprlock
#
# Uses this rice's own wallpaper, palette and terminal face, so the lock
# screen is not the one surface that ignores the theme.

background {
    monitor =
    path = /home/birch/Pictures/Wallpapers/themes/mono.jpg
    blur_passes = 0
    blur_size = 0
    brightness = 0.8
    contrast = 1.0
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(ffffffff)
    inner_color = rgba(0a0a0ad8)
    font_color = rgba(e8e8e8ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##2e2e2e">password</span>
    hide_input = false
    rounding = 0
    check_color = rgba(c8c8c8ff)
    fail_color = rgba(c8c8c8ff)
    fail_text = <span foreground="##c8c8c8">denied</span>
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(e8e8e8ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(2e2e2eff)
    font_size = 16
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = mono
    color = rgba(ffffffff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
