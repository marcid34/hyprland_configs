# mono — mako
#
# Mono — Swiss. No colour at all. Typography, grid and negative space.
# Geometry tracks the bar: 2px radius, 1px border,
# and margins that sum to the same grid Hyprland uses for gaps.

anchor=top-right
layer=top
outer-margin=34,4,4,4
margin=4
padding=11,13
width=390
height=170
border-size=1
border-radius=2

font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#121212ff
text-color=#e8e8e8
border-color=#2e2e2e
progress-color=over #1c1c1c

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#6e6e6e
border-color=#1c1c1c
default-timeout=3000

[urgency=normal]
text-color=#e8e8e8
border-color=#2e2e2e
default-timeout=5000

[urgency=critical]
text-color=#c8c8c8
border-color=#c8c8c8
progress-color=over #c8c8c8
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
