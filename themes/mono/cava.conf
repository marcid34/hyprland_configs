## mono — cava
## Launched by linux_showcase.sh as:  cava -p <this file>
## Kept out of ~/.config/cava so switching rice cannot clobber a config you
## may have tuned by hand.

[general]
framerate = 60
autosens = 1
overshoot = 20
bars = 0
bar_width = 2
bar_spacing = 1

[input]
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[smoothing]
noise_reduction = 45

[color]
background = '#0a0a0a'
foreground = '#e8e8e8'
gradient = 1
gradient_count = 5
gradient_color_1 = '#1c1c1c'
gradient_color_2 = '#ffffff'
gradient_color_3 = '#9a9a9a'
gradient_color_4 = '#c8c8c8'
gradient_color_5 = '#e8e8e8'
