# crimson — mako
# Crimson — burgundy and oxblood. Warm dark, no brightness anywhere.
anchor=bottom-right
layer=top
outer-margin=44,6,6,6
margin=6
padding=13,16
width=390
height=170
border-size=1
border-radius=8
font=Adwaita Sans 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left
background-color=#201116ff
text-color=#f0dde2
border-color=#3e1f28
progress-color=over #2c161d
icons=1
max-icon-size=30
icon-location=left
default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1
on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#7a5560
border-color=#2c161d
default-timeout=3000

[urgency=normal]
text-color=#f0dde2
border-color=#3e1f28
default-timeout=5000

[urgency=critical]
text-color=#c72c48
border-color=#c72c48
progress-color=over #c72c48
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
