# crimson — hyprlock
# Crimson — burgundy and oxblood. Warm dark, no brightness anywhere.
background {
    monitor =
    path = /home/birch/.config/rices/hyprland_configs/wallpapers/crimson/crimson.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 2
    dots_center = true
    outer_color = rgba(c72c48ff)
    inner_color = rgba(180d10d9)
    font_color = rgba(f0dde2ff)
    placeholder_text = <span foreground="##7a5560">password</span>
    rounding = 8
    check_color = rgba(7ca8a0ff)
    fail_color = rgba(c72c48ff)
    position = 0, -60
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f0dde2ff)
    font_size = 88
    font_family = Adwaita Mono
    position = 0, 120
    halign = center
    valign = center
}
label {
    monitor =
    text = crimson
    color = rgba(c72c48ff)
    font_size = 12
    font_family = Adwaita Mono
    position = 0, 40
    halign = center
    valign = bottom
}
