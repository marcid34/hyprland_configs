--[[ amber — conky
     No bar on this rice: the status IS the desktop. Big phosphor readout
     down the left, monospace, one hue. ]]
conky.config = {
    alignment = 'middle_left',
    gap_x = 60, gap_y = 0,
    minimum_width = 460, minimum_height = 400,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_argb_value = 0,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    double_buffer = true,
    draw_shades = false, draw_outline = false, draw_borders = false,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font Mono:size=11',
    default_color = '2b2116',
    color1 = 'ffb000',
    color2 = 'ffb000',
    update_interval = 1.0,
    uppercase = true,
}

conky.text = [[
${color1}${font JetBrainsMono Nerd Font Mono:size=44}${time %H:%M}${font}${color}
${color2}${time %A %d %B %Y}${color}
${color1}${hr 1}${color}
 SYS   ${color2}${nodename}${color}
 UP    ${color2}${uptime_short}${color}
 KERN  ${color2}${kernel}${color}
${color1}${hr 1}${color}
 CPU   ${color2}${cpu cpu0}%${color}  ${color1}${cpubar cpu0 6,180}${color}
 MEM   ${color2}${memperc}%${color}  ${color1}${membar 6,180}${color}
 DISK  ${color2}${fs_used_perc /}%${color}  ${color1}${fs_bar 6,180 /}${color}
${color1}${hr 1}${color}
 NET   ${color2}${addr wlan0}${color}
 DOWN  ${color2}${downspeed wlan0}${color}
 UP    ${color2}${upspeed wlan0}${color}
]]
