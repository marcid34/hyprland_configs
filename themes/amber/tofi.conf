# tofi — one line, like a shell prompt. Suits the console rices.
font = JetBrainsMono Nerd Font Mono
font-size = 13
width = 100%
height = 34
horizontal = true
anchor = top
prompt-text = "run: "
padding-top = 0
padding-bottom = 0
padding-left = 14
padding-right = 14
result-spacing = 22
border-width = 0
outline-width = 0
background-color = #0c0a08
text-color = #ffb000
prompt-color = #ffb000
selection-color = #ffb000
min-input-width = 120
