# amber — mako
#
# Amber CRT — single-phosphor terminal. One colour, tight grid, glow.
# Geometry tracks the bar: 0px radius, 1px border,
# and margins that sum to the same grid Hyprland uses for gaps.

anchor=top-right
layer=top
outer-margin=34,4,4,4
margin=4
padding=11,13
width=390
height=170
border-size=1
border-radius=0

font=Terminus 12
markup=1
format=<b>%s</b>\n%b
text-alignment=left

background-color=#141009ff
text-color=#ffb000
border-color=#2b2116
progress-color=over #1e1710

icons=1
max-icon-size=32
icon-location=left

default-timeout=5000
ignore-timeout=0
max-visible=5
group-by=app-name
actions=1
history=1

on-button-left=dismiss
on-button-right=dismiss-group
on-button-middle=invoke-default-action

[urgency=low]
text-color=#7a5400
border-color=#1e1710
default-timeout=3000

[urgency=normal]
text-color=#ffb000
border-color=#2b2116
default-timeout=5000

[urgency=critical]
text-color=#ff5f00
border-color=#ff5f00
progress-color=over #ff5f00
default-timeout=0

[mode=do-not-disturb]
invisible=1

[mode=do-not-disturb urgency=critical]
invisible=0
