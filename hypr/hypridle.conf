# hypridle — idle handling
#
# Deliberately conservative: dim at 5 minutes so you get a warning, lock at
# 10, screen off at 12, and suspend only after 30. Nothing here destroys work.
# The waybar idle_inhibitor toggle (the coffee-cup glyph) suppresses all of it
# when you are watching something.

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid stacking instances
    before_sleep_cmd = loginctl lock-session    # lock before the lid closes
    after_sleep_cmd = hyprctl dispatch dpms on  # wake the panel reliably
    ignore_dbus_inhibit = false                 # respect app-level inhibits
}

listener {
    timeout = 300                               # 5 min — dim as a warning
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

listener {
    timeout = 600                               # 10 min — lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 720                               # 12 min — screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

listener {
    timeout = 1800                              # 30 min — suspend
    on-timeout = systemctl suspend
}
